services:
  kafka:
    image: apache/kafka:4.0.1
    container_name: lab1-kafka
    hostname: kafka
    ports:
      - "9094:9094"
    command:
      - bash
      - -lc
      - |
        cat > /tmp/kafka.properties <<'EOF'
        process.roles=broker,controller
        node.id=1
        controller.quorum.voters=1@kafka:9093
        listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
        advertised.listeners=PLAINTEXT://kafka:9092,EXTERNAL://host.docker.internal:9094
        listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
        inter.broker.listener.name=PLAINTEXT
        controller.listener.names=CONTROLLER
        log.dirs=/tmp/kraft-combined-logs
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        group.initial.rebalance.delay.ms=0
        auto.create.topics.enable=true
        EOF
        /opt/kafka/bin/kafka-storage.sh format -t "$(/opt/kafka/bin/kafka-storage.sh random-uuid)" -c /tmp/kafka.properties --ignore-formatted
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/kafka.properties
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongodb:
    image: mongo:7
    container_name: lab1-mongodb
    ports:
      - "27017:27017"
    volumes:
      - lab1-mongodb-data:/data/db

volumes:
  lab1-mongodb-data:
